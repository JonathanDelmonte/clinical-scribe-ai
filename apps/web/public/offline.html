<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sem conexão — Consulta Viva</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        font:
          16px/1.6 system-ui,
          -apple-system,
          sans-serif;
        background: #fcfcfd;
        color: #1e2229;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #1c1f26;
          color: #eef0f3;
        }
        .aviso {
          border-color: #3a3f4a;
        }
      }
      main {
        max-width: 26rem;
        text-align: center;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 12px;
        color: #6b7280;
      }
      .aviso {
        margin-top: 20px;
        border: 1px solid #e4e6ea;
        border-radius: 10px;
        padding: 12px 16px;
        text-align: left;
        font-size: 0.875rem;
      }
      button {
        margin-top: 16px;
        border: 0;
        border-radius: 10px;
        background: #0f8e9c;
        color: #fff;
        font: inherit;
        font-weight: 600;
        padding: 10px 20px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sem conexão</h1>
      <p>Não foi possível falar com o servidor.</p>
      <div class="aviso">
        <strong>Gravações não se perdem.</strong> O que foi gravado neste aparelho fica
        guardado nele e é enviado quando a conexão voltar — abra a pasta do paciente e o
        aviso de envio pendente aparece.
      </div>
      <button onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
