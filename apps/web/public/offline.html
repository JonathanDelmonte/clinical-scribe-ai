<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sem conexão — Consulta Viva</title>
    <style>
      /*
       * Tudo inline e sem fonte externa: esta página existe justamente para
       * quando a rede não responde. Mesma paleta clara da aplicação.
       */
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        font:
          16px/1.6 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: #0f1b24;
        background:
          radial-gradient(
            40rem 30rem at 12% 8%,
            rgb(168 238 226 / 0.55),
            transparent 70%
          ),
          radial-gradient(
            36rem 28rem at 92% 18%,
            rgb(187 178 255 / 0.4),
            transparent 70%
          ),
          radial-gradient(
            40rem 30rem at 70% 100%,
            rgb(255 232 220 / 0.7),
            transparent 70%
          ),
          #f2f5f6;
      }
      main {
        max-width: 27rem;
        padding: 36px 32px 32px;
        border: 1px solid rgb(255 255 255 / 0.9);
        border-radius: 30px;
        background: rgb(255 255 255 / 0.62);
        box-shadow:
          inset 0 1px 0 #fff,
          0 30px 60px -30px rgb(22 52 70 / 0.35);
        -webkit-backdrop-filter: blur(24px) saturate(1.4);
        backdrop-filter: blur(24px) saturate(1.4);
        text-align: center;
      }
      h1 {
        font-size: 2rem;
        font-weight: 400;
        letter-spacing: -0.03em;
        line-height: 1.1;
        margin: 0 0 10px;
      }
      p {
        margin: 0 0 12px;
        color: #445561;
      }
      .aviso {
        margin-top: 22px;
        border: 1px solid rgb(255 255 255 / 0.9);
        border-radius: 16px;
        background: rgb(213 245 240 / 0.6);
        padding: 14px 16px;
        text-align: left;
        font-size: 0.875rem;
        line-height: 1.55;
        color: #445561;
      }
      .aviso strong {
        color: #0f1b24;
      }
      button {
        margin-top: 22px;
        min-height: 52px;
        border: 0;
        border-radius: 999px;
        background: linear-gradient(180deg, #1d2c37, #0f1b24);
        box-shadow: 0 12px 24px -12px rgb(15 27 36 / 0.6);
        color: #f2fbfa;
        font: inherit;
        font-weight: 600;
        padding: 0 26px;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid #0b7b7a;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sem conexão</h1>
      <p>Não foi possível falar com o servidor.</p>
      <div class="aviso">
        <strong>Gravações não se perdem.</strong> O que foi gravado neste aparelho fica
        guardado nele e é enviado quando a conexão voltar — abra a pasta do paciente e o
        aviso de envio pendente aparece.
      </div>
      <button onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
