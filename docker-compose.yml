services:
  # Postgres local para desenvolvimento offline.
  # A imagem pgvector/pgvector já traz a extensão — o mesmo que o Supabase
  # oferece, para que o assistente RAG da Fase 4 não exija troca de banco.
  postgres:
    image: pgvector/pgvector:pg17
    container_name: scribe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: scribe
    ports:
      # 5433 no host, não 5432: é comum já existir um PostgreSQL instalado
      # na máquina ocupando a 5432. Quando isso acontece, `localhost:5432`
      # vai para o Postgres errado e o erro que aparece é "autenticação
      # falhou" — que não parece, de jeito nenhum, com "porta ocupada".
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./packages/db/sql/00-extensions.sql:/docker-entrypoint-initdb.d/00-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scribe"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Motor de transcrição LOCAL — o motor do plano grátis.
  #
  # O áudio da consulta nunca sai deste container. Fica atrás de um profile
  # porque é pesado (alguns GB de imagem e modelo) e nem toda tarefa precisa
  # dele. Suba com `pnpm asr:up`.
  asr-local:
    build: ./services/asr-local
    image: scribe-asr-local
    container_name: scribe-asr-local
    restart: unless-stopped
    profiles: ["asr"]
    ports:
      - "8001:8000"
    environment:
      # `medium` equilibra qualidade e velocidade em CPU. Para o spike do
      # Marco 1, que decide o fornecedor, troque para `large-v3`.
      WHISPER_MODEL: ${WHISPER_MODEL:-medium}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-pt}
      # Sem token, o serviço sobe e transcreve, mas não separa vozes.
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      # Sem este volume, cada `up` rebaixaria gigabytes de modelo.
      - asr-models:/models
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python3 -c "import urllib.request;urllib.request.urlopen(''http://localhost:8000/health'')"',
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      # A primeira subida baixa o modelo. Sem esta folga, o healthcheck
      # declararia o container morto no meio do download.
      start_period: 300s

  # O worker de PRODUÇÃO: lê a fila do site no ar (o banco no Supabase) e usa
  # o motor DESTE computador para processar as consultas — de qualquer pessoa.
  #
  # Com `restart: unless-stopped`, depois da primeira subida basta abrir o
  # Docker Desktop: o motor e este worker voltam sozinhos, sem terminal.
  #
  #     docker compose -f docker-compose.yml -f docker-compose.gpu.yml   #       --profile asr --profile producao up -d --build
  #
  # A configuração vem de `.env.producao`, que nunca vai para o GitHub.
  worker-producao:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: scribe-worker
    container_name: scribe-worker-producao
    restart: unless-stopped
    profiles: ["producao"]
    env_file: .env.producao
    environment:
      # Dentro da rede do Docker o motor atende pelo nome do serviço, na porta
      # do container (8000) — a 8001 é só a porta publicada no Windows.
      ASR_LOCAL_URL: http://asr-local:8000
    depends_on:
      asr-local:
        condition: service_healthy

volumes:
  postgres-data:
  asr-models:
