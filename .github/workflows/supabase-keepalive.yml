name: Supabase keep-alive

# O plano gratuito do Supabase pausa projetos sem atividade por 7 dias.
# Este workflow faz uma consulta leve ao banco a cada 3 dias para manter o projeto ativo.
# Requer os secrets SUPABASE_URL e SUPABASE_SERVICE_ROLE_KEY no repositório.

on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    name: Consulta ao banco
    runs-on: ubuntu-latest
    steps:
      - name: Consulta objective_templates
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl --fail-with-body -sS \
            "$SUPABASE_URL/rest/v1/objective_templates?select=id&limit=1" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"
