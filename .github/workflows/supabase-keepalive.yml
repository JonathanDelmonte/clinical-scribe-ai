name: Supabase keep-alive

# O plano gratuito do Supabase pausa projetos sem atividade por 7 dias.
# Este workflow faz uma consulta leve ao banco a cada 3 dias para manter o projeto ativo.
# Requer o secret SUPABASE_DATABASE_URL no repositório, com a connection string do
# Supabase via pooler (aws-0-sa-east-1.pooler.supabase.com). A conexão direta
# (db.<ref>.supabase.co) só tem IPv6 e não funciona nos runners do GitHub.

on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    name: Consulta ao banco
    runs-on: ubuntu-latest
    steps:
      - name: Consulta objective_templates
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "select count(*) from objective_templates;"
